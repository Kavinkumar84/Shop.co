<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/Logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopCo - Premium Electronics &amp; Gadgets</title>
    <meta name="description" content="ShopCo offers the best deals on premium electronics, smart gadgets, mobile phones, and home appliances. Experience cinema-style entertainment and smart living." />
    <link rel="canonical" href="https://shopco.site/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shopco.site/" />
    <meta property="og:title" content="ShopCo - Premium Electronics &amp; Gadgets" />
    <meta property="og:description" content="ShopCo offers the best deals on premium electronics, smart gadgets, mobile phones, and home appliances." />
    <meta property="og:image" content="https://shopco.site/assets/banner1.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://shopco.site/" />
    <meta property="twitter:title" content="ShopCo - Premium Electronics &amp; Gadgets" />
    <meta property="twitter:description" content="ShopCo offers the best deals on premium electronics, smart gadgets, mobile phones, and home appliances." />
    <meta property="twitter:image" content="https://shopco.site/assets/banner1.png" />

    <!-- ✅ PERFORMANCE: Preconnect to API backend (reduces connection time) -->
    <link rel="preconnect" href="https://shopco.site" />
    <link rel="preconnect" href="https://api.shopco.site" />

    <!-- ✅ PERFORMANCE: Preconnect to Cloudinary CDN (category/product images) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- ✅ PERFORMANCE: DNS prefetch fallback for older browsers -->
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- ✅ PERFORMANCE: Preload critical font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root">
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
